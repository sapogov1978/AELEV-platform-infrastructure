    environment:
      <<: *postgresql-environment
      AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_ID: "3"
    ports:
      - "${AELEV_INFRASTRUCTURE_POSTGRESQL_BIND:?set AELEV_INFRASTRUCTURE_POSTGRESQL_BIND}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_PORT}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_PORT}"
      - "${AELEV_INFRASTRUCTURE_POSTGRESQL_BIND:?set AELEV_INFRASTRUCTURE_POSTGRESQL_BIND}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_REST_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_REST_PORT}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_REST_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_REST_PORT}"
    volumes:
      - postgresql-3-data:/var/lib/postgresql/data
      - type: bind
        source: ./secrets/node-3
        target: /run/secrets/postgresql
        read_only: true
        bind: {create_host_path: false}

  etcd-3:
    <<: *etcd
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd-3
      ETCD_LISTEN_CLIENT_URLS: https://0.0.0.0:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT}
      ETCD_ADVERTISE_CLIENT_URLS: https://${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_HOST:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_HOST}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT}
      ETCD_LISTEN_PEER_URLS: https://0.0.0.0:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_PEER_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_PEER_PORT}
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_HOST:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_HOST}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_PEER_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_PEER_PORT}
    ports:
      - "${AELEV_INFRASTRUCTURE_POSTGRESQL_BIND:?set AELEV_INFRASTRUCTURE_POSTGRESQL_BIND}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT}"
      - "${AELEV_INFRASTRUCTURE_POSTGRESQL_BIND:?set AELEV_INFRASTRUCTURE_POSTGRESQL_BIND}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_PEER_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_PEER_PORT}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_PEER_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_PEER_PORT}"
    volumes:
      - etcd-3-data:/etcd-data
      - type: bind
        source: ./secrets/etcd-3
        target: /certs
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /usr/local/bin/etcdctl, "--endpoints=https://localhost:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT}", --cacert=/certs/ca.crt, --cert=/certs/client.crt, --key=/certs/client.key, endpoint, health]
      interval: 5s
      timeout: 5s
      retries: 20

  database-provisioner:
    image: ${AELEV_INFRASTRUCTURE_POSTGRESQL_IMAGE:?set AELEV_INFRASTRUCTURE_POSTGRESQL_IMAGE}
    profiles: [provision]
    command: [provision]
    environment: *postgresql-environment
    volumes:
      - type: bind
        source: ./secrets/admin
        target: /run/secrets/postgresql
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: [/run/aelev:mode=0755, /tmp:mode=1777]
    security_opt: [no-new-privileges:true]
    restart: "no"
    networks: [postgresql]

volumes:
  postgresql-status-data:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_STATE_VOLUME:?set in the postgresql .env file}
  postgresql-1-data:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_DATA_VOLUME:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_DATA_VOLUME}
  etcd-1-data:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_VOLUME:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_VOLUME}
  postgresql-2-data:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_DATA_VOLUME:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_DATA_VOLUME}
  etcd-2-data:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_ETCD_VOLUME:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_ETCD_VOLUME}
  postgresql-3-data:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_DATA_VOLUME:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_DATA_VOLUME}
  etcd-3-data:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_VOLUME:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_VOLUME}

networks:
  postgresql:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NETWORK:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NETWORK}
