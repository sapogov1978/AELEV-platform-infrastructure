        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /usr/local/bin/etcdctl, "--endpoints=https://localhost:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT}", --cacert=/certs/ca.crt, --cert=/certs/client.crt, --key=/certs/client.key, endpoint, health]
