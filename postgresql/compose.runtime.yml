      - "${AELEV_INFRASTRUCTURE_POSTGRESQL_BIND:?set AELEV_INFRASTRUCTURE_POSTGRESQL_BIND}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_PEER_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_PEER_PORT}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_PEER_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_PEER_PORT}"
    volumes:
      - etcd-1-data:/etcd-data
      - type: bind
        source: ./secrets/etcd-1
        target: /certs
