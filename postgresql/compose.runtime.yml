services:
  postgresql-status-publisher:
    image: ${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_IMAGE:?set publisher image in the postgresql .env file}
    build: {context: ., dockerfile: Dockerfile, target: runtime}
    profiles: [ui]
    entrypoint: ["python", "/opt/aelev/status_publisher.py"]
    command: [run]
    stop_grace_period: 2m
    user: "101:101"
    group_add: ["${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_SECRET_GID:?set in the postgresql .env file}"]
    environment: *ui-status-environment
    restart: ${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_RESTART_POLICY:?set AELEV_INFRASTRUCTURE_POSTGRESQL_UI_RESTART_POLICY}
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts: ["host.docker.internal:host-gateway", "keycloak:host-gateway"]
    mem_limit: ${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_MEMORY_LIMIT:?set in the postgresql .env file}
    volumes:
      - postgresql-status-data:/var/lib/aelev-status
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_SECRET_ROOT:?set in the postgresql .env file}
        target: /run/secrets/status
        read_only: true
        bind: {create_host_path: false}
    networks: [postgresql]
    healthcheck:
      test: [CMD, python, -S, /opt/aelev/publisher-health.py, AELEV_INFRASTRUCTURE_POSTGRESQL_]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgresql-status-provision:
    image: ${AELEV_INFRASTRUCTURE_POSTGRESQL_IMAGE:?set in the postgresql .env file}
    build: {context: ., dockerfile: Dockerfile, target: runtime}
    profiles: [provision]
    entrypoint: ["python", "/opt/aelev/status_publisher.py"]
    command: [provision]
    user: "${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_PROVISION_UID:?set in the postgresql .env file}:${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_SECRET_GID:?set in the postgresql .env file}"
    environment: *ui-status-environment
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts: ["host.docker.internal:host-gateway", "keycloak:host-gateway"]
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_SECRET_ROOT:?set in the postgresql .env file}
        target: /run/secrets/status
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_POSTGRESQL_UI_ADMIN_ROOT:?set in the postgresql .env file}
        target: /run/secrets/status-admin
        read_only: true
        bind: {create_host_path: false}
    networks: [postgresql]


  postgresql-1:
    <<: *postgresql
    labels:
      io.aelev.postgresql.node: postgresql-1
      io.aelev.postgresql.cluster: ${AELEV_INFRASTRUCTURE_POSTGRESQL_CLUSTER:?set AELEV_INFRASTRUCTURE_POSTGRESQL_CLUSTER}
    environment:
      <<: *postgresql-environment
      AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_ID: "1"
    ports:
      - "${AELEV_INFRASTRUCTURE_POSTGRESQL_BIND:?set AELEV_INFRASTRUCTURE_POSTGRESQL_BIND}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_PORT}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_PORT}"
      - "${AELEV_INFRASTRUCTURE_POSTGRESQL_BIND:?set AELEV_INFRASTRUCTURE_POSTGRESQL_BIND}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_REST_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_REST_PORT}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_REST_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_REST_PORT}"
    volumes:
      - postgresql-1-data:/var/lib/postgresql/data
      - type: bind
        source: ./secrets/node-1
        target: /run/secrets/postgresql
        read_only: true
        bind: {create_host_path: false}

  etcd-1:
    <<: *etcd
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd-1
      ETCD_LISTEN_CLIENT_URLS: https://0.0.0.0:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT}
      ETCD_ADVERTISE_CLIENT_URLS: https://${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_HOST:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_HOST}:${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT}
