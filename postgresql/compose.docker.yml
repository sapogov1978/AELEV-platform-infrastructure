x-fencing-environment: &fencing-environment
  AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_TIMEOUT_SECONDS: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_TIMEOUT_SECONDS:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_TIMEOUT_SECONDS}
  AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_FENCING_URL: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_FENCING_URL:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_FENCING_URL}
  AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_FENCING_URL: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_FENCING_URL:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_FENCING_URL}
  AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_FENCING_URL: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_FENCING_URL:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_FENCING_URL}

x-fenced-node: &fenced-node
  environment: *fencing-environment
  depends_on:
    postgresql-fencer: {condition: service_healthy}

services:
  postgresql-status-publisher:
    environment: *fencing-environment
  postgresql-1: *fenced-node
  postgresql-2: *fenced-node
  postgresql-3: *fenced-node
  postgresql-fencer:
    image: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_IMAGE:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_IMAGE}
    build: {context: ., dockerfile: Dockerfile}
    command: [fencing-serve]
    # The executor needs no ownership changes; all capabilities stay dropped.
    entrypoint: [python, -m, aelev_postgresql]
    restart: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_RESTART_POLICY:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_RESTART_POLICY}
    read_only: true
    tmpfs: [/tmp:mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    group_add: ["${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_SECRET_GID:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_SECRET_GID}"]
    mem_limit: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_MEMORY:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_MEMORY}
    cpu_shares: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_CPU_SHARES:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_CPU_SHARES}
    environment:
      <<: *fencing-environment
      AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_MODE: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_MODE:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_MODE}
      AELEV_INFRASTRUCTURE_POSTGRESQL_CLUSTER: ${AELEV_INFRASTRUCTURE_POSTGRESQL_CLUSTER:?set AELEV_INFRASTRUCTURE_POSTGRESQL_CLUSTER}
      AELEV_INFRASTRUCTURE_POSTGRESQL_ADMIN_USER: ${AELEV_INFRASTRUCTURE_POSTGRESQL_ADMIN_USER:?set AELEV_INFRASTRUCTURE_POSTGRESQL_ADMIN_USER}
      AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_DOCKER_LOCAL_NODES: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_DOCKER_LOCAL_NODES:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_DOCKER_LOCAL_NODES}
      AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_PORT: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_PORT}
      AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_HOST: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_HOST:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_HOST}
      AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_ETCD_CLIENT_PORT}
      AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_ETCD_HOST: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_ETCD_HOST:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_ETCD_HOST}
      AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_ETCD_CLIENT_PORT: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_ETCD_CLIENT_PORT}
      AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_HOST: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_HOST:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_HOST}
      AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_ETCD_CLIENT_PORT}
    ports:
      - "${AELEV_INFRASTRUCTURE_POSTGRESQL_BIND:?set AELEV_INFRASTRUCTURE_POSTGRESQL_BIND}:${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_PORT}:${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_PORT:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_PORT}"
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_DOCKER_SOCKET:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_DOCKER_SOCKET}
        target: /run/docker.sock
        bind: {create_host_path: false}
      - type: bind
        source: ./secrets/fencing
        target: /run/aelev/secrets
        read_only: true
        bind: {create_host_path: false}
      - postgresql-fencing-data:/var/lib/aelev-fencing
    networks: [postgresql]
    healthcheck:
      test: [CMD, python, -S, -m, aelev_postgresql.fencing_probe]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgresql-fencing-data:
    name: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_STATE_VOLUME:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_STATE_VOLUME}
