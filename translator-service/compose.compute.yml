# Opaque-provider compute recipe shared by the root and standalone lifecycles.

x-provider-image: &provider-image
  image: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_IMAGE:?set exact admitted provider image by digest}

x-worker-image: &worker-image
  image: ${AELEV_INFRASTRUCTURE_TRANSLATOR_WORKER_IMAGE:?set exact admitted Translator worker image by digest}

x-database-environment: &database-environment
  AELEV_TRANSLATOR_PRESENCE_INTERVAL_SECONDS: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PRESENCE_INTERVAL_SECONDS:?set presence interval}
  AELEV_TRANSLATOR_PRESENCE_TTL_SECONDS: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PRESENCE_TTL_SECONDS:?set presence TTL}
  AELEV_ENVIRONMENT: ${AELEV_INFRASTRUCTURE_TRANSLATOR_ENVIRONMENT:?set environment}
  AELEV_TRANSLATOR_DATABASE_HOST: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_HOST:?set routed database host}
  AELEV_TRANSLATOR_DATABASE_PORT: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_PORT:?set database port}
  AELEV_TRANSLATOR_DATABASE_NAME: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_NAME:?set database name}
  AELEV_TRANSLATOR_DATABASE_USER: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_USER:?set database user}
  AELEV_TRANSLATOR_DATABASE_PASSWORD_FILE: /run/secrets/database/postgres-password
  AELEV_TRANSLATOR_DATABASE_SSLMODE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_SSLMODE:?set database sslmode}
  AELEV_TRANSLATOR_DATABASE_CA_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_CA_FILE:?set database CA filename}
  AELEV_TRANSLATOR_DATABASE_CLIENT_CERT_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_CLIENT_CERT_FILE:?set database client certificate filename}
  AELEV_TRANSLATOR_DATABASE_CLIENT_KEY_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_CLIENT_KEY_FILE:?set database client key filename}
  AELEV_TRANSLATOR_DATABASE_SECRET_ROOT: /run/secrets/database
  AELEV_TRANSLATOR_OTLP_HTTP_ENDPOINT: ${AELEV_INFRASTRUCTURE_TRANSLATOR_OTLP_HTTP_ENDPOINT?set empty for local without telemetry or an HTTPS durable sender endpoint}
  AELEV_TRANSLATOR_TELEMETRY_CA_FILE: /run/secrets/telemetry/client/sender-ca.crt
  AELEV_TRANSLATOR_TELEMETRY_CLIENT_CERT_FILE: /run/secrets/telemetry/client/runtime.crt
  AELEV_TRANSLATOR_TELEMETRY_CLIENT_KEY_FILE: /run/secrets/telemetry/client/runtime.key

x-database-identity: &database-identity
  type: bind
  source: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_SECRET_ROOT:?set database secret root}
  target: /run/secrets/database
  read_only: true
  bind: {create_host_path: false}

x-telemetry-identity: &telemetry-identity
  type: bind
  source: ${AELEV_INFRASTRUCTURE_TRANSLATOR_TELEMETRY_SECRET_ROOT:?set telemetry secret root}/client
  target: /run/secrets/telemetry/client
  read_only: true
  bind: {create_host_path: false}

x-provider-secret: &provider-secret
  type: bind
  source: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_SECRET_FILE:?set provider API secret file}
  target: /run/secrets/provider/credential.env
  read_only: true
  bind: {create_host_path: false}

services:
  translation-provider:
    <<: *provider-image
    volumes:
      - translation-provider-socket:/run/aelev-translator
      - *provider-secret
    group_add:
      - "${AELEV_INFRASTRUCTURE_TRANSLATOR_SECRET_GID:?set provider credential group}"
    restart: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_RESTART_POLICY:-on-failure:3}
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_MEMORY_LIMIT:?set provider memory limit}
    cpus: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_CPUS:?set provider CPU limit}
    networks: [translation-provider-egress]

  translator-worker:
    <<: *worker-image
    command: [python, -m, translator_service.runtime, worker]
    environment:
      <<: *database-environment
      AELEV_TRANSLATOR_SOCKET_PATH: /run/aelev-translator/translator.sock
      AELEV_TRANSLATOR_HEALTH_ROLE: worker
      AELEV_TRANSLATOR_HIGH_PRIORITY_BURST: ${AELEV_INFRASTRUCTURE_TRANSLATOR_HIGH_PRIORITY_BURST:?set high priority burst}
    volumes:
      - translation-provider-socket:/run/aelev-translator:ro
      - *database-identity
      - *telemetry-identity
    depends_on:
      translation-provider: {condition: service_healthy}
    restart: ${AELEV_INFRASTRUCTURE_TRANSLATOR_RESTART_POLICY:-on-failure:3}
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${AELEV_INFRASTRUCTURE_TRANSLATOR_ROLE_MEMORY_LIMIT:?set worker memory limit}
    cpus: ${AELEV_INFRASTRUCTURE_TRANSLATOR_ROLE_CPUS:?set worker CPU limit}
    stop_grace_period: 250s
    networks: [translator-data, translator-telemetry]
    healthcheck:
      test: [CMD, python, -S, /opt/aelev/src/translator_service/local_health.py]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  translation-provider-socket:

networks:
  translation-provider-egress:
    name: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_EGRESS_NETWORK:?set provider egress network}
    ipam:
      config:
        - subnet: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_EGRESS_SUBNET:?set a non-overlapping provider egress subnet}
  translator-data:
    name: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_NETWORK:?set routed database network}
    external: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_NETWORK_EXTERNAL:?set false for the root/local owner stack or true for a routed standalone database network}
  translator-telemetry:
    name: ${AELEV_INFRASTRUCTURE_TRANSLATOR_TELEMETRY_NETWORK:?set routed telemetry network}
    external: ${AELEV_INFRASTRUCTURE_TRANSLATOR_TELEMETRY_NETWORK_EXTERNAL:?set false for the root/local owner stack or true for a routed standalone telemetry network}
