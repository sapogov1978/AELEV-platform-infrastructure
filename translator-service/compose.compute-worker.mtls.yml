# One worker placement; all dependencies use explicitly routed network origins.
services:
  translator-worker:
    image: ${AELEV_INFRASTRUCTURE_TRANSLATOR_WORKER_IMAGE:?set exact admitted network worker image by digest}
    command: [python, -m, translator_service.runtime, worker]
    group_add:
      - "${AELEV_INFRASTRUCTURE_TRANSLATOR_SECRET_GID:?set runtime credential read group}"
    environment:
      AELEV_TRANSLATOR_PROVIDER_TRANSPORT: mtls
      AELEV_TRANSLATOR_PROVIDER_URL: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_URL:?set routed HTTPS provider origin}
      AELEV_TRANSLATOR_PROVIDER_TLS_ROOT: /run/secrets/compute-provider
      AELEV_ENVIRONMENT: ${AELEV_INFRASTRUCTURE_TRANSLATOR_ENVIRONMENT:?set environment}
      AELEV_TRANSLATOR_HEALTH_ROLE: worker
      AELEV_TRANSLATOR_HIGH_PRIORITY_BURST: ${AELEV_INFRASTRUCTURE_TRANSLATOR_HIGH_PRIORITY_BURST:?set high priority burst}
      AELEV_TRANSLATOR_PRESENCE_INTERVAL_SECONDS: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PRESENCE_INTERVAL_SECONDS:?set presence interval}
      AELEV_TRANSLATOR_PRESENCE_TTL_SECONDS: ${AELEV_INFRASTRUCTURE_TRANSLATOR_PRESENCE_TTL_SECONDS:?set presence TTL}
      AELEV_TRANSLATOR_DATABASE_HOST: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_HOST:?set routed database host}
      AELEV_TRANSLATOR_DATABASE_PORT: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_PORT:?set database port}
      AELEV_TRANSLATOR_DATABASE_NAME: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_NAME:?set database name}
      AELEV_TRANSLATOR_DATABASE_USER: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_USER:?set database user}
      AELEV_TRANSLATOR_DATABASE_PASSWORD_FILE: /run/secrets/database/postgres-password
      AELEV_TRANSLATOR_DATABASE_SSLMODE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_SSLMODE:?set database sslmode}
      AELEV_TRANSLATOR_DATABASE_CA_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_CA_FILE:?set database CA filename}
      AELEV_TRANSLATOR_DATABASE_CLIENT_CERT_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_CLIENT_CERT_FILE:?set database client certificate filename}
      AELEV_TRANSLATOR_DATABASE_CLIENT_KEY_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_CLIENT_KEY_FILE:?set database client key filename}
      AELEV_TRANSLATOR_DATABASE_SECRET_ROOT: /run/secrets/database
      AELEV_TRANSLATOR_OTLP_HTTP_ENDPOINT: ${AELEV_INFRASTRUCTURE_TRANSLATOR_OTLP_HTTP_ENDPOINT:?set routed durable telemetry sender endpoint}
      AELEV_TRANSLATOR_TELEMETRY_CA_FILE: /run/secrets/telemetry/client/sender-ca.crt
      AELEV_TRANSLATOR_TELEMETRY_CLIENT_CERT_FILE: /run/secrets/telemetry/client/runtime.crt
      AELEV_TRANSLATOR_TELEMETRY_CLIENT_KEY_FILE: /run/secrets/telemetry/client/runtime.key
    volumes:
      - type: volume
        source: worker-svid
        target: /run/secrets/compute-provider
        read_only: true
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_TRANSLATOR_WORKER_IDENTITY_POLICY:?set worker public identity policy}
        target: /run/secrets/compute-provider/identity.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_SECRET_ROOT:?set worker database identity directory}
        target: /run/secrets/database
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_TRANSLATOR_TELEMETRY_SECRET_ROOT:?set worker telemetry identity directory}/client
        target: /run/secrets/telemetry/client
        read_only: true
        bind: {create_host_path: false}
    restart: ${AELEV_INFRASTRUCTURE_TRANSLATOR_RESTART_POLICY:-on-failure:3}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${AELEV_INFRASTRUCTURE_TRANSLATOR_ROLE_MEMORY_LIMIT:?set worker memory limit}
    cpus: ${AELEV_INFRASTRUCTURE_TRANSLATOR_ROLE_CPUS:?set worker CPU limit}
    stop_grace_period: 250s
    networks: [worker-routed]
    healthcheck:
      test: [CMD, python, -S, /opt/aelev/src/translator_service/local_health.py]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  worker-svid:
    name: ${AELEV_INFRASTRUCTURE_TRANSLATOR_WORKER_SVID_VOLUME:?set this worker instance SVID delivery volume}
    external: true

networks:
  worker-routed:
