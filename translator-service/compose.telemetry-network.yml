# Explicit ports and private per-instance files; base/default recipe is unchanged.
services:
  translator-telemetry-sender:
    ports:
      - "${AELEV_INFRASTRUCTURE_TRANSLATOR_TELEMETRY_BIND_ADDRESS:?set this sender instance's bind address}:${AELEV_INFRASTRUCTURE_TRANSLATOR_TELEMETRY_HTTP_PORT:?set this sender instance's published HTTP port}:4318"
    configs:
      - source: translator-network-sender
        target: /etc/aelev/sender.local.json
      - source: translator-network-prometheus
        target: /etc/aelev/prometheus.yml
configs:
  translator-network-sender:
    file: ${AELEV_INFRASTRUCTURE_TRANSLATOR_TELEMETRY_CONFIGURATION_ROOT:?set this instance's prepared private configuration}/sender.local.json
  translator-network-prometheus:
    file: ${AELEV_INFRASTRUCTURE_TRANSLATOR_TELEMETRY_CONFIGURATION_ROOT:?set this instance's prepared private configuration}/prometheus.yml
