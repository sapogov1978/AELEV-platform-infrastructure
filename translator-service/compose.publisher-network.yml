# Select only for this independently placed owner status publisher.
services:
  translator-service-status-publisher:
    environment:
      AELEV_INFRASTRUCTURE_TRANSLATOR_UI_PROBE_PROFILE: network
      AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_URL: ${AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_URL:?set this publisher's explicit HTTPS healthz URL}
      AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_SERVER_NAME: ${AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_SERVER_NAME:?set the API server certificate name}
      AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_CA_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_CA_FILE:?set this publisher's own mounted API CA file}
      AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_CERT_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_CERT_FILE:?set this publisher's own API query certificate}
      AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_KEY_FILE: ${AELEV_INFRASTRUCTURE_TRANSLATOR_UI_API_PROBE_KEY_FILE:?set this publisher's own API query private key}
