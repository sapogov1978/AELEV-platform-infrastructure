[project]
name = "aelev-infrastructure-spire"
version = "0.1.0"
description = "Owner-independent SPIRE deployment and bounded SVID delivery"
requires-python = ">=3.13,<3.14"
dependencies = ["cryptography==50.0.1", "aelev-platform-ui-client==1.1.2"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
aelev-platform-ui-client = {path = "vendor/aelev_platform_ui_client-1.1.2-py3-none-any.whl"}

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pyright = "1.1.414"
ruff = "0.12.11"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "test", "build_artifacts.py", "build_sqlite.py", "bootstrap.py", "local-inputs.py"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
