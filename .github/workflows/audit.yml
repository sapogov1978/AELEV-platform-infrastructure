name: audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.python.outputs.matrix }}
      ui: ${{ steps.ui.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python tools/ci_inventory.py .
      - id: python
        run: python tools/ci_inventory.py --matrix python --github-output >> "$GITHUB_OUTPUT"
      - id: ui
        run: python tools/ci_inventory.py --matrix ui --github-output >> "$GITHUB_OUTPUT"

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python tools/audit_boundary.py .
      - run: python tools/check_markdown_links.py .
      - run: python tools/check_json.py .
      - run: python tools/check_contract_digests.py .
      - run: python tools/check_infrastructure.py
      - run: python tools/check_container_security.py .
      - run: python tools/check_secrets.py .
      - run: python tools/check_supply_chain.py .
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: sh -n .githooks/pre-commit tools/install_git_hooks.sh spire/install.sh spire/export.sh
      - run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q -x '/(\.git|runtime|node_modules|graphify-out|obsolete)/' .

  python-tests:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.inventory.outputs.python) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install poetry==2.2.1 poetry-plugin-export==1.9.0 pip-audit==2.9.0
      - run: python tools/run_ci_suite.py python "${{ matrix.suite.path }}"
      - if: matrix.suite.mode != 'lock-only'
        run: poetry --directory "${{ matrix.suite.path }}" export --without-hashes --format requirements.txt --output "$RUNNER_TEMP/requirements.txt"
      - if: matrix.suite.mode != 'lock-only'
        run: pip-audit --requirement "$RUNNER_TEMP/requirements.txt"

  ui-tests:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.inventory.outputs.ui) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: "${{ matrix.suite }}/package-lock.json"
      - run: python tools/run_ci_suite.py ui "${{ matrix.suite }}"

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install setuptools==80.9.0 bandit==1.8.6 semgrep==1.136.0
      - run: python tools/check_bandit.py .
      - run: semgrep scan --config .semgrep.yml --error --metrics=off .

  quickstart-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: ./infrastructure init
      - run: python tools/check_build_plan.py
      - run: ./infrastructure plan

  recovery-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install poetry==2.2.1
      - run: echo "COVERAGE_FILE=$RUNNER_TEMP/recovery.coverage" >> "$GITHUB_ENV"
      - run: poetry install --no-interaction --no-ansi
        working-directory: test_infrastructure
      - run: poetry run python -m pip install coverage==7.10.6
        working-directory: test_infrastructure
      - run: poetry run coverage run --branch --source=recovery,recovery_cli,recovery_host -m pytest --junitxml="${{ runner.temp }}/recovery-junit.xml"
        working-directory: test_infrastructure
      - run: poetry run coverage json -o "${{ runner.temp }}/recovery-coverage.json"
        working-directory: test_infrastructure
      - run: python tools/check_recovery_coverage.py "${{ runner.temp }}/recovery-coverage.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recovery-coverage
          path: |
            ${{ runner.temp }}/recovery-junit.xml
            ${{ runner.temp }}/recovery-coverage.json
          if-no-files-found: error

  ui-image-security:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.inventory.outputs.ui) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install checksum-pinned Trivy 0.76.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.76.1 --repo aquasecurity/trivy --pattern trivy_0.76.1_Linux-64bit.tar.gz --dir "$RUNNER_TEMP"
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" -C "$RUNNER_TEMP" trivy
      - run: python tools/build_ci_ui_image.py "${{ matrix.suite }}" --tag drp/ci-ui:${{ strategy.job-index }}
      - run: python tools/image_evidence.py --image drp/ci-ui:${{ strategy.job-index }} --output "${{ runner.temp }}/ui-image-evidence" --trivy "${{ runner.temp }}/trivy"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-image-evidence-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ui-image-evidence
          if-no-files-found: error
