name: release-postgresql-fencing-image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: release-postgresql-fencing-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
      - name: Require completed audit and real native HA for this source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          revision = os.environ['GITHUB_SHA']
          url = 'https://api.github.com/repos/' + repository + '/actions/runs?per_page=100'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          for name in ('audit', 'postgresql-fencing-ssh-native'):
              current = [run for run in runs if run['head_sha'] == revision and run['name'] == name]
              current.sort(key=lambda run: (run['run_number'], run['run_attempt']), reverse=True)
              if not current or current[0]['status'] != 'completed' or current[0]['conclusion'] != 'success':
                  raise SystemExit('REQUIRED_EXACT_SOURCE_WORKFLOW_NOT_SUCCESSFUL: ' + name)
          print('Exact-source audit and native HA gates passed')
          PY
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: postgresql
          target: fencing-ssh
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sapogov1978/aelev-platform-infrastructure-postgresql-fencing:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign exact digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/sapogov1978/aelev-platform-infrastructure-postgresql-fencing@$DIGEST"
      - name: Record release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/sapogov1978/aelev-platform-infrastructure-postgresql-fencing@$DIGEST" > release-digest.txt
          printf '### PostgreSQL fencing image\n\n`%s`\n' "ghcr.io/sapogov1978/aelev-platform-infrastructure-postgresql-fencing@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: postgresql-fencing-digest-${{ github.sha }}
          path: release-digest.txt
          if-no-files-found: error
