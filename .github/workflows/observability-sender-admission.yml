name: admit-observability-sender-native-amd64

on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact signed sender image digest
        required: true
        type: string
      source:
        description: Exact source commit of the image
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBJECT_IMAGE: ${{ inputs.image }}
      SUBJECT_SOURCE: ${{ inputs.source }}
    steps:
      - name: Validate immutable subject and native host
        run: |
          test "$(uname -m)" = x86_64
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'ghcr.io/sapogov1978/aelev-platform-infrastructure-observability-sender@sha256:[0-9a-f]{64}', os.environ['SUBJECT_IMAGE'])
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SUBJECT_SOURCE'])
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test tools from the exact owner source
        run: |
          docker build --file observability/delivery/Dockerfile.status --target checks \
            --build-context tests=./observability/delivery/test \
            --build-arg PYTHON_IMAGE=python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844 \
            --tag aelev/sender-admission-tools:checks observability/delivery
      - name: Test the published amd64 runtime without replacing its libraries
        run: |
          docker pull --platform linux/amd64 "$SUBJECT_IMAGE"
          cat > "$RUNNER_TEMP/Dockerfile.sender-admission" <<'DOCKERFILE'
          ARG SUBJECT_IMAGE
          FROM aelev/sender-admission-tools:checks AS tools
          FROM ${SUBJECT_IMAGE}
          USER root
          RUN python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          paths = ['/usr/lib/libssl.so.3', '/usr/lib/libcrypto.so.3', '/usr/local/lib/libsqlite3.so.0', '/usr/local/bin/python3.13']
          before = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          subprocess.run(['apk', 'add', '--no-cache', 'openssl', 'docker-cli', 'docker-cli-compose'], check=True)
          assert before == {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          PY
          COPY --from=tools /opt/venv /opt/check-venv
          COPY --from=tools /work /work
          ENV PATH=/opt/check-venv/bin:$PATH
          WORKDIR /work
          RUN python - <<'PY'
          import platform, sqlite3
          from pathlib import Path
          assert platform.machine() == 'x86_64'
          assert platform.python_version() == '3.13.7'
          assert sqlite3.sqlite_version == '3.53.4'
          for source, installed in [('delivery.py', 'delivery.py'), ('delivery_health.py', 'delivery_health.py'), ('delivery_snapshot.py', 'delivery_snapshot.py'), ('renewal.py', 'telemetry-renewal.py')]:
              assert Path('/work', source).read_bytes() == Path('/opt/aelev', installed).read_bytes()
          PY
          USER 10001:10001
          ENTRYPOINT ["python", "-m", "pytest"]
          DOCKERFILE
          docker build --platform linux/amd64 --file "$RUNNER_TEMP/Dockerfile.sender-admission" \
            --build-arg SUBJECT_IMAGE="$SUBJECT_IMAGE" --tag aelev/sender-admission:checks .
          name="aelev-sender-native-admission-$GITHUB_RUN_ID"
          docker create --name "$name" --platform linux/amd64 --network none \
            --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 256 \
            --label io.aelev.owner=infrastructure-sender-admission \
            aelev/sender-admission:checks -q -p no:cacheprovider --junitxml=/tmp/proof.xml
          trap 'docker rm --force "$name" >/dev/null' EXIT
          set +e
          docker start --attach "$name"
          result=$?
          set -e
          docker cp "$name:/tmp/proof.xml" "$RUNNER_TEMP/sender-native.xml"
          docker logs "$name" > "$RUNNER_TEMP/sender-native.log" 2>&1
          test "$result" = 0
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from xml.etree import ElementTree
          root = ElementTree.parse(Path(os.environ['RUNNER_TEMP']) / 'sender-native.xml').getroot()
          totals = {k: sum(int(s.attrib.get(k, 0)) for s in root.iter('testsuite')) for k in ('tests', 'failures', 'errors', 'skipped')}
          assert totals == {'tests': 131, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          proof = {'image': os.environ['SUBJECT_IMAGE'], 'source_commit': os.environ['SUBJECT_SOURCE'], 'platform': 'linux/amd64', 'native': True, 'totals': totals, 'runtime_library_hashes_preserved': True, 'working_runtime_switched': False, 'inference_requested': False}
          (Path(os.environ['RUNNER_TEMP']) / 'sender-native-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sender-native-admission-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sender-native.xml
            ${{ runner.temp }}/sender-native.log
            ${{ runner.temp }}/sender-native-proof.json
          if-no-files-found: error
