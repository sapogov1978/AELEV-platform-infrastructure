name: postgresql-fencing-ssh-native

on:
  workflow_dispatch:
    inputs:
      image:
        description: Optional exact signed registry fencer digest; requires source
        required: false
        type: string
      source:
        description: Exact source SHA of the registry image; requires image
        required: false
        type: string
  push:
    paths:
      - .github/workflows/postgresql-fencing-ssh.yml
      - .github/workflows/postgresql-fencing-release.yml
      - postgresql/Dockerfile
      - postgresql/compose*.yml
      - postgresql/pyproject.toml
      - postgresql/poetry.lock
      - postgresql/src/**
      - postgresql/prepare-tls.py
      - postgresql/fencing-node.py
      - postgresql/test/fencing-ssh-lifecycle.py
      - postgresql/test/ha_observation.py
      - postgresql/test/ha_cleanup.py
      - postgresql/test/ha_return_barrier.py
      - postgresql/test/test_ha_return_barrier.py
      - postgresql/vendor/**

permissions:
  contents: read
  packages: read

jobs:
  native-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    env:
      SUBJECT_IMAGE: ${{ inputs.image }}
      SUBJECT_SOURCE: ${{ inputs.source }}
    steps:
      - name: Validate paired immutable registry inputs and native host
        run: |
          python3 - <<'PY'
          import os, platform, re
          assert platform.machine() == 'x86_64'
          image, source = os.environ['SUBJECT_IMAGE'], os.environ['SUBJECT_SOURCE']
          assert bool(image) == bool(source), 'IMAGE_AND_SOURCE_REQUIRED_TOGETHER'
          if image:
              assert re.fullmatch(r'ghcr.io/sapogov1978/aelev-platform-infrastructure-postgresql-fencing@sha256:[0-9a-f]{64}', image)
              assert re.fullmatch(r'[0-9a-f]{40}', source)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: inputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.image != ''
        with:
          cosign-release: v3.1.4
      - name: Verify release identity and exact digest before registry execution
        if: inputs.image != ''
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SOURCE"
          cosign verify --certificate-identity \
            'https://github.com/sapogov1978/AELEV-platform-infrastructure/.github/workflows/postgresql-fencing-release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$SUBJECT_IMAGE" > "$RUNNER_TEMP/fencer-signature.json"
          docker pull --platform linux/amd64 "$SUBJECT_IMAGE"
      - name: Build only native pinned owner images
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          os.umask(0o077)
          output = Path(os.environ['RUNNER_TEMP']) / 'postgresql-fencing-ssh'
          output.mkdir(mode=0o700)
          info = json.loads(subprocess.check_output(['docker','info','--format','{{json .}}'],text=True))
          assert info['Architecture'] in ('x86_64','amd64') and info['OSType'] == 'linux'
          owner = Path('postgresql')
          images = {}
          subject = os.environ['SUBJECT_IMAGE']
          targets = ('runtime','checks') if subject else ('runtime','checks','fencing-ssh')
          for target in targets:
              image_file = output / (target + '.image-id')
              subprocess.run(['docker','build','--platform','linux/amd64','--target',target,'--build-context','tests='+str(owner/'test'),'--iidfile',str(image_file),str(owner)],check=True)
              images[target] = image_file.read_text().strip()
          if subject:
              inspected = json.loads(subprocess.check_output(['docker','image','inspect',subject],text=True))[0]
              assert inspected['Architecture'] == 'amd64' and inspected['Os'] == 'linux'
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', inspected['Id'])
              images['fencing-ssh'] = subject
              (output/'registry-subject.json').write_text(json.dumps({'image':subject,'source_commit':os.environ['SUBJECT_SOURCE'],'image_id':inspected['Id'],'platform':'linux/amd64','signature_identity':'https://github.com/sapogov1978/AELEV-platform-infrastructure/.github/workflows/postgresql-fencing-release.yml@refs/heads/main','oidc_issuer':'https://token.actions.githubusercontent.com','production_dependencies_replaced':False,'working_runtime_switched':False,'queue_resume_issued':False},indent=2)+'\n')
          references = re.findall(r'image: (gcr\.io/etcd-development/etcd:[^\s]+)',(owner/'compose.runtime.yml').read_text())
          assert len(set(references)) == 1
          subprocess.run(['docker','pull','--platform','linux/amd64',references[0]],check=True)
          (output/'images.json').write_text(json.dumps(images,indent=2)+'\n')
          PY
      - name: Exercise real native HA and coordinator crash replay
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'postgresql-fencing-ssh'
          images = json.loads((output/'images.json').read_text())
          subprocess.run([sys.executable,'postgresql/test/fencing-ssh-lifecycle.py','--output',str(output/'acceptance'),'--sql-image',images['runtime'],'--fencing-image',images['fencing-ssh'],'--ssh-host-base-image',images['checks']],check=True)
          PY
      - name: Install checksum-pinned Trivy 0.76.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.76.1 --repo aquasecurity/trivy --pattern trivy_0.76.1_Linux-64bit.tar.gz --dir "$RUNNER_TEMP"
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Retain native fencer raw findings and SBOM
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'postgresql-fencing-ssh'
          images = json.loads((output/'images.json').read_text())
          subprocess.run([sys.executable,'tools/image_evidence.py','--image',images['fencing-ssh'],'--output',str(output/'fencer-image-evidence'),'--trivy',str(Path(os.environ['RUNNER_TEMP'])/'trivy')],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgresql-fencing-ssh-native-amd64-${{ github.sha }}-${{ matrix.trial }}
          path: |
            ${{ runner.temp }}/postgresql-fencing-ssh/acceptance/proof.json
            ${{ runner.temp }}/postgresql-fencing-ssh/images.json
            ${{ runner.temp }}/postgresql-fencing-ssh/fencer-image-evidence
            ${{ runner.temp }}/postgresql-fencing-ssh/registry-subject.json
            ${{ runner.temp }}/fencer-signature.json
          if-no-files-found: warn
