name: admit-translator-worker-native-amd64

on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact signed Translator worker image digest
        required: true
        type: string
      source:
        description: Exact source commit of the worker image
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUBJECT_IMAGE: ${{ inputs.image }}
      SUBJECT_SOURCE: ${{ inputs.source }}
    steps:
      - name: Validate immutable subject and native host
        run: |
          test "$(uname -m)" = x86_64
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'ghcr.io/sapogov1978/aelev-platform-infrastructure-translator-worker@sha256:[0-9a-f]{64}', os.environ['SUBJECT_IMAGE'])
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SUBJECT_SOURCE'])
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test tools from exact owner source
        run: |
          docker build --target test --build-context translator_tests=./translator-service/test \
            --tag aelev/worker-admission-tools:checks translator-service
      - name: Test the published worker without replacing production dependencies
        run: |
          docker pull --platform linux/amd64 "$SUBJECT_IMAGE"
          cat > "$RUNNER_TEMP/Dockerfile.worker-admission" <<'DOCKERFILE'
          ARG SUBJECT_IMAGE
          FROM aelev/worker-admission-tools:checks AS tools
          FROM ${SUBJECT_IMAGE}
          USER root
          RUN install -d --owner=10001 --group=10001 --mode=0700 /reports
          COPY --from=tools /opt/aelev/.venv /opt/artifact-test-dependencies
          COPY --from=tools /opt/aelev/src /work/expected-source
          COPY --from=tools /opt/aelev/test/test_provider_transport.py /opt/aelev/test/provider_tls_fixtures.py /work/test/
          RUN python - <<'PY'
          import ctypes, hashlib, importlib.util, json, platform, shutil, sqlite3, ssl, sys
          from pathlib import Path
          import psycopg, psycopg.pq
          from sqlalchemy import create_engine
          assert platform.python_version() == '3.13.7'
          assert sqlite3.sqlite_version == '3.53.4'
          assert shutil.which('openssl')
          engine = create_engine('postgresql+psycopg://artifact_probe@localhost/never_connected')
          engine.dispose()
          production = Path('/opt/aelev/.venv')
          def tree_digest():
              h = hashlib.sha256()
              for p in sorted(production.rglob('*')):
                  if p.is_file():
                      h.update(str(p.relative_to(production)).encode() + b'\0')
                      h.update(hashlib.sha256(p.read_bytes()).digest())
              return h.hexdigest()
          before = tree_digest()
          libraries = sorted({line.split()[-1] for line in Path('/proc/self/maps').read_text().splitlines() if '/' in line and '.so' in line} | {sys.executable})
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in libraries}
          openssl_versions = {}
          for path in libraries:
              if '/libssl' in path or '/libcrypto' in path:
                  api = ctypes.CDLL(path).OpenSSL_version
                  api.restype = ctypes.c_char_p
                  api.argtypes = [ctypes.c_int]
                  openssl_versions[path] = api(0).decode()
          tools = Path('/opt/artifact-test-dependencies/lib/python3.13/site-packages')
          target = Path('/opt/native-worker-test-tools')
          target.mkdir()
          for name in ('pytest', '_pytest', 'pluggy', 'iniconfig', 'packaging', 'pygments'):
              assert importlib.util.find_spec(name) is None, name
              shutil.copytree(tools / name, target / name)
          assert importlib.util.find_spec('py') is None
          shutil.copy2(tools / 'py.py', target / 'py.py')
          expected = Path('/work/expected-source')
          installed = Path('/opt/aelev/src')
          source_files = {p.relative_to(expected) for p in expected.rglob('*.py')}
          assert source_files == {p.relative_to(installed) for p in installed.rglob('*.py')}
          for relative in source_files:
              assert (expected / relative).read_bytes() == (installed / relative).read_bytes(), relative
          assert tree_digest() == before
          assert hashes == {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in libraries}
          Path('/opt/native-worker-layer-proof.json').write_text(json.dumps({'python': platform.python_version(), 'sqlite': sqlite3.sqlite_version, 'architecture': platform.machine(), 'psycopg': psycopg.__version__, 'libpq': psycopg.pq.version(), 'postgresql_driver': psycopg.pq.__impl__, 'openssl_versions': openssl_versions, 'database_connection_opened': False, 'production_dependencies_sha256': before, 'production_dependencies_preserved': True, 'runtime_library_sha256': hashes, 'runtime_libraries_preserved': True, 'exact_owner_source_files': len(source_files)}))
          PY
          ENV PYTHONPATH=/opt/native-worker-test-tools:/opt/aelev/src:/work/test PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          WORKDIR /work
          USER 10001:10001
          ENTRYPOINT ["python", "-m", "pytest"]
          DOCKERFILE
          docker build --platform linux/amd64 --file "$RUNNER_TEMP/Dockerfile.worker-admission" \
            --build-arg SUBJECT_IMAGE="$SUBJECT_IMAGE" --tag aelev/worker-admission:checks .
          name="aelev-worker-native-admission-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          reports="$name-reports"
          if docker volume inspect "$reports" >/dev/null 2>&1; then exit 1; fi
          docker volume create --label io.aelev.owner=infrastructure-worker-admission "$reports"
          trap 'docker rm --force "$name" >/dev/null 2>&1; docker volume rm "$reports" >/dev/null' EXIT
          docker create --name "$name" --platform linux/amd64 --network none --read-only \
            --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,src=$reports,dst=/reports" \
            --memory 1g --pids-limit 256 --label io.aelev.owner=infrastructure-worker-admission \
            aelev/worker-admission:checks -q -p no:cacheprovider test/test_provider_transport.py --junitxml=/reports/proof.xml
          set +e
          docker start --attach "$name"
          result=$?
          set -e
          docker logs "$name" > "$RUNNER_TEMP/worker-native.log" 2>&1
          docker cp "$name:/opt/native-worker-layer-proof.json" "$RUNNER_TEMP/worker-native-layer.json"
          docker cp "$name:/reports/proof.xml" "$RUNNER_TEMP/worker-native.xml"
          test "$result" = 0
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from xml.etree import ElementTree
          folder = Path(os.environ['RUNNER_TEMP'])
          root = ElementTree.parse(folder / 'worker-native.xml').getroot()
          totals = {k: sum(int(s.attrib.get(k, 0)) for s in root.iter('testsuite')) for k in ('tests', 'failures', 'errors', 'skipped')}
          assert totals == {'tests': 23, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          layer = json.loads((folder / 'worker-native-layer.json').read_text())
          assert layer['architecture'] == 'x86_64'
          proof = {'image': os.environ['SUBJECT_IMAGE'], 'source_commit': os.environ['SUBJECT_SOURCE'], 'platform': 'linux/amd64', 'native': True, 'totals': totals, 'layer': layer, 'worker_loop_started': False, 'queue_resume_issued': False, 'working_runtime_switched': False, 'inference_requested': False}
          (folder / 'worker-native-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: worker-native-admission-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/worker-native.xml
            ${{ runner.temp }}/worker-native.log
            ${{ runner.temp }}/worker-native-layer.json
            ${{ runner.temp }}/worker-native-proof.json
          if-no-files-found: error
