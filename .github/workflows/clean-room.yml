name: clean-room-full-local

on:
  workflow_dispatch:
    inputs:
      diagnostic_stage:
        description: "Select full acceptance or an isolated diagnostic stage"
        type: choice
        default: full
        options:
          - full
          - remaining-stages
          - telemetry-and-translator
          - postgresql-lifecycle
          - telemetry-onboarding
          - translator-lifecycle
          - spire-lifecycle
          - spire-observation
          - recovery-lifecycle
      diagnostic_repetitions:
        description: "Diagnostic repetitions on the same source and image set (1-3)"
        type: choice
        default: "1"
        options: ["1", "2", "3"]

permissions:
  contents: read
  packages: read

concurrency:
  group: clean-room-full-local-${{ inputs.diagnostic_stage || 'full' }}
  cancel-in-progress: false

jobs:
  functional-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Reclaim ephemeral runner disk
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install admitted operator tooling
        run: python -m pip install poetry==2.2.1
      - name: Authenticate ephemeral runner to private GHCR packages
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Initialize owner-local inputs without starting containers
        run: python3 tools/full_local.py init
      - name: Verify admitted images before the expensive build
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/admitted-private-images"
          import json
          from pathlib import Path

          manifest = json.loads(Path("full-local.json").read_text())
          for item in manifest["external_inputs"]:
              if item["kind"] == "container-image-digest":
                  print(item["admitted_reference"])
          for item in manifest.get("build_inputs", []):
              if item["kind"] == "container-image-digest":
                  print(item["admitted_reference"])
          for item in manifest.get("release_images", []):
              print(item["admitted_reference"])
          PY
          while IFS= read -r image; do
            docker buildx imagetools inspect "$image" >/dev/null
          done < "$RUNNER_TEMP/admitted-private-images"
      - name: Run complete clean-room gate
        env:
          DRP_SPIRE_DOCKER_SOCKET_APPROVAL: operator-root-equivalent-v1
          BUILDKIT_PROGRESS: plain
          COMPOSE_PROGRESS: plain
          DIAGNOSTIC_STAGE: ${{ inputs.diagnostic_stage }}
          DIAGNOSTIC_REPETITIONS: ${{ inputs.diagnostic_repetitions }}
        run: |
          CHROMIUM=$(command -v google-chrome || command -v chromium || true)
          test -n "$CHROMIUM"
          install -m 600 /dev/null "$RUNNER_TEMP/clean-room-viewer-password"
          cp platform-ui/secrets/provision/operator-password "$RUNNER_TEMP/clean-room-viewer-password"
          chmod 600 "$RUNNER_TEMP/clean-room-viewer-password"
          DIAGNOSTIC_ARGS=()
          if [ "$DIAGNOSTIC_STAGE" = remaining-stages ]; then
            DIAGNOSTIC_ARGS=(--diagnostic-stage telemetry-onboarding --diagnostic-stage translator-lifecycle --diagnostic-stage spire-lifecycle --diagnostic-stage spire-observation --diagnostic-stage recovery-lifecycle)
          elif [ "$DIAGNOSTIC_STAGE" = telemetry-and-translator ]; then
            DIAGNOSTIC_ARGS=(--diagnostic-stage telemetry-onboarding --diagnostic-stage translator-lifecycle)
          elif [ -n "$DIAGNOSTIC_STAGE" ] && [ "$DIAGNOSTIC_STAGE" != full ]; then
            DIAGNOSTIC_ARGS=(--diagnostic-stage "$DIAGNOSTIC_STAGE" --diagnostic-repetitions "$DIAGNOSTIC_REPETITIONS")
          fi
          python3 test_infrastructure/clean_room_gate.py \
            --output "$RUNNER_TEMP/clean-room-evidence" \
            --ui-url https://127.0.0.1:18082 \
            --viewer-user platform-operator \
            --viewer-password-file "$RUNNER_TEMP/clean-room-viewer-password" \
            --chromium "$CHROMIUM" \
            --allow-local-certificate "${DIAGNOSTIC_ARGS[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: clean-room-full-local-${{ github.sha }}
          path: ${{ runner.temp }}/clean-room-evidence
          if-no-files-found: warn
      - name: Remove ephemeral registry session
        if: always()
        run: docker logout ghcr.io || true
