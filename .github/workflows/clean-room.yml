name: clean-room-full-local

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-room-full-local
  cancel-in-progress: false

jobs:
  functional-reproduction:
    runs-on: [self-hosted, aelev-clean-room]
    timeout-minutes: 360
    environment: clean-room
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
      - name: Initialize owner-local inputs without starting containers
        run: python3 tools/full_local.py init
      - name: Admit exact translation images
        env:
          PROVIDER_IMAGE: ${{ vars.AELEV_TRANSLATION_PROVIDER_IMAGE }}
          WORKER_IMAGE: ${{ vars.AELEV_TRANSLATOR_WORKER_IMAGE }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          digest = re.compile(r"^[^@\s]+@sha256:[0-9a-f]{64}$")
          values = {
              "AELEV_INFRASTRUCTURE_TRANSLATOR_PROVIDER_IMAGE": os.environ.get("PROVIDER_IMAGE", ""),
              "AELEV_INFRASTRUCTURE_TRANSLATOR_WORKER_IMAGE": os.environ.get("WORKER_IMAGE", ""),
          }
          if not all(digest.fullmatch(value) for value in values.values()):
              raise SystemExit("CLEAN_ROOM_TRANSLATION_IMAGE_DIGEST_REQUIRED")
          path = Path("translator-service/.env")
          rows = []
          seen = set()
          for row in path.read_text().splitlines():
              key = row.partition("=")[0]
              if key in values:
                  rows.append(key + "=" + values[key])
                  seen.add(key)
              else:
                  rows.append(row)
          if seen != set(values):
              raise SystemExit("CLEAN_ROOM_TRANSLATION_IMAGE_VARIABLE_MISSING")
          path.write_text("\n".join(rows) + "\n")
          PY
      - name: Run complete clean-room gate
        env:
          DRP_SPIRE_DOCKER_SOCKET_APPROVAL: operator-root-equivalent-v1
          VIEWER_PASSWORD: ${{ secrets.AELEV_CLEAN_ROOM_VIEWER_PASSWORD }}
          VIEWER_USER: ${{ vars.AELEV_CLEAN_ROOM_VIEWER_USER }}
          CHROMIUM: ${{ vars.AELEV_CLEAN_ROOM_CHROMIUM }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/clean-room-viewer-password"
          printf '%s\n' "$VIEWER_PASSWORD" > "$RUNNER_TEMP/clean-room-viewer-password"
          python3 test_infrastructure/clean_room_gate.py \
            --output "$RUNNER_TEMP/clean-room-evidence" \
            --ui-url https://127.0.0.1:18082 \
            --viewer-user "$VIEWER_USER" \
            --viewer-password-file "$RUNNER_TEMP/clean-room-viewer-password" \
            --chromium "$CHROMIUM" \
            --allow-local-certificate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: clean-room-full-local-${{ github.sha }}
          path: ${{ runner.temp }}/clean-room-evidence
          if-no-files-found: error
