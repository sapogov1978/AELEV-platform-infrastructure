name: release-observability-sender-image

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-observability-sender-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: observability/delivery
          file: observability/delivery/Dockerfile.sender
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sapogov1978/aelev-platform-infrastructure-observability-sender:${{ github.sha }}
          build-args: |
            PROMETHEUS_IMAGE=prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign exact digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/sapogov1978/aelev-platform-infrastructure-observability-sender@$DIGEST"
      - name: Record release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/sapogov1978/aelev-platform-infrastructure-observability-sender@$DIGEST" > release-digest.txt
          printf '### Observability sender image\n\n`%s`\n' "ghcr.io/sapogov1978/aelev-platform-infrastructure-observability-sender@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: observability-sender-digest-${{ github.sha }}
          path: release-digest.txt
          if-no-files-found: error
