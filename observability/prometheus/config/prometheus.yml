global:
  scrape_interval: ${AELEV_INFRASTRUCTURE_PROMETHEUS_SCRAPE_INTERVAL}
  evaluation_interval: ${AELEV_INFRASTRUCTURE_PROMETHEUS_SCRAPE_INTERVAL}

storage:
  tsdb:
    out_of_order_time_window: ${AELEV_INFRASTRUCTURE_PROMETHEUS_RETENTION}

rule_files:
  - /etc/aelev/rules/*.yml

scrape_configs:
  - job_name: prometheus
    scheme: https
    tls_config: &client_tls
      ca_file: /run/secrets/observability/ca.crt
      cert_file: /run/secrets/observability/client.crt
      key_file: /run/secrets/observability/client.key
    static_configs:
      - targets: [prometheus:9090]
  - job_name: delivery
    scheme: https
    tls_config: *client_tls
    static_configs:
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_DELIVERY_METRICS_TARGET}]
  - job_name: otel-collector
    scheme: https
    tls_config: *client_tls
    static_configs:
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_COLLECTOR_METRICS_TARGET}]
  - job_name: blackbox-exporter
    scheme: https
    tls_config: *client_tls
    static_configs:
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_BLACKBOX_METRICS_TARGET}]
  - job_name: loki
    scheme: https
    tls_config: *client_tls
    static_configs:
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_LOKI_METRICS_TARGET}]
  - job_name: tempo
    scheme: https
    tls_config: *client_tls
    static_configs:
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_TEMPO_METRICS_TARGET}]
  - job_name: infrastructure-health
    metrics_path: /probe
    params: {module: [http_ready]}
    scheme: https
    tls_config: *client_tls
    static_configs:
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_PROMETHEUS_HEALTH_URL}]
        labels: {component_id: prometheus}
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_DELIVERY_HEALTH_URL}]
        labels: {component_id: delivery}
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_COLLECTOR_HEALTH_URL}]
        labels: {component_id: otel-collector}
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_BLACKBOX_HEALTH_URL}]
        labels: {component_id: blackbox-exporter}
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_LOKI_HEALTH_URL}]
        labels: {component_id: loki}
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_TEMPO_HEALTH_URL}]
        labels: {component_id: tempo}
      - targets: [${AELEV_INFRASTRUCTURE_PROMETHEUS_GRAFANA_HEALTH_URL}]
        labels: {component_id: grafana}
    relabel_configs: &probe_relabel
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: ${AELEV_INFRASTRUCTURE_PROMETHEUS_BLACKBOX_PROBE_TARGET}}
  - job_name: owner-http-health
    metrics_path: /probe
    params: {module: [http_ready]}
    scheme: https
    tls_config: *client_tls
    file_sd_configs:
      - files: [/etc/aelev/targets/http/*.json]
    relabel_configs: *probe_relabel
  - job_name: owner-tcp-health
    metrics_path: /probe
    params: {module: [tcp_connect]}
    scheme: https
    tls_config: *client_tls
    file_sd_configs:
      - files: [/etc/aelev/targets/tcp/*.json]
    relabel_configs: *probe_relabel
