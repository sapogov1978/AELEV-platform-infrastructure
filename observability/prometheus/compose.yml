name: ${AELEV_INFRASTRUCTURE_PROMETHEUS_COMPOSE_PROJECT:?set in the prometheus env file}

x-operator-environment: &operator-environment
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_PORT: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_PORT:?set own operator port}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_MODE: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_MODE:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_PUBLIC_URL: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_PUBLIC_URL:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_BIND: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_BIND:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_UPSTREAM: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_UPSTREAM:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_IDENTITY_URL: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_IDENTITY_URL:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_BACKCHANNEL: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_BACKCHANNEL:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_REALM: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_REALM:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_CLIENT_ID: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_CLIENT_ID:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_USER: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_USER:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_TIMEOUT_SECONDS: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_TIMEOUT_SECONDS:?set in the prometheus env file}

x-status-environment: &status-environment
  <<: *operator-environment
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_REVISION: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_REVISION:?set positive owner description revision}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_URL: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_URL:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_IDENTITY_URL: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_IDENTITY_URL:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_REALM: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_REALM:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_CLIENT_ID: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_CLIENT_ID:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_AUDIENCE: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_AUDIENCE:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_MODULE_ID: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_MODULE_ID:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_INTERVAL_SECONDS: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_INTERVAL_SECONDS:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_TIMEOUT_SECONDS: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_TIMEOUT_SECONDS:?set in the prometheus env file}
  AELEV_INFRASTRUCTURE_PROMETHEUS_UI_HEALTH_URL: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_HEALTH_URL:?set in the prometheus env file}

x-status-runtime: &status-runtime
  image: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_IMAGE:?set in the prometheus env file}
  build:
    context: .
    dockerfile: Dockerfile.status
    target: runtime
    args: {PYTHON_IMAGE: "${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_PYTHON_IMAGE:?set in the prometheus env file}"}
  environment: *status-environment
  read_only: true
  tmpfs: ["/tmp:size=8m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  extra_hosts: ["host.docker.internal:host-gateway", "keycloak:host-gateway"]
  networks: [prometheus-ui]

services:
  prometheus-operator:
    <<: *status-runtime
    image: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_IMAGE:?set own operator release}
    entrypoint: [python, -m, aelev_observability_tools.operator]
    command: [AELEV_INFRASTRUCTURE_PROMETHEUS_]
    environment: *operator-environment
    healthcheck:
      test: [CMD, python, -S, /opt/aelev/operator-health.py]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: "no"
    user: "101:${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_SECRET_GID:?set own operator secret group}"
    group_add: ["${AELEV_INFRASTRUCTURE_PROMETHEUS_SECRET_GID:?set own native secret group}"]
    mem_limit: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_MEMORY_LIMIT:?set own operator memory limit}
    ports: ["${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_BIND:?set own operator bind}:${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_PORT:?set own operator port}:8080"]
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_SECRET_ROOT:?set own operator secrets}
        target: /run/secrets/operator
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_TLS_ROOT:?set own operator TLS credentials}
        target: /run/secrets/observability
        read_only: true
        bind: {create_host_path: false}

  prometheus-operator-provision:
    <<: *status-runtime
    profiles: [provision]
    entrypoint: [python, -m, aelev_observability_tools.operator_provision]
    command: [AELEV_INFRASTRUCTURE_PROMETHEUS_]
    environment: *operator-environment
    user: "${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_PROVISION_UID:?set own provision uid}:${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_SECRET_GID:?set own operator secret group}"
    restart: "no"
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_OPERATOR_SECRET_ROOT:?set own operator secrets}
        target: /run/secrets/operator
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_ADMIN_ROOT:?set own admin secrets}
        target: /run/secrets/status-admin
        read_only: true
        bind: {create_host_path: false}

  prometheus:
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    group_add: ["${AELEV_INFRASTRUCTURE_PROMETHEUS_SECRET_GID:?set in the prometheus env file}"]
    networks: [prometheus-ui]
    image: ${AELEV_INFRASTRUCTURE_PROMETHEUS_IMAGE:?set in the prometheus env file}
    mem_limit: ${AELEV_INFRASTRUCTURE_PROMETHEUS_MEMORY_LIMIT:?set in the prometheus env file}
    command: ["--config.file=/etc/aelev/prometheus.yml","--web.config.file=/etc/aelev/web.yml","--web.enable-lifecycle","--web.enable-remote-write-receiver","--web.enable-otlp-receiver","--storage.tsdb.retention.time=${AELEV_INFRASTRUCTURE_PROMETHEUS_RETENTION:?set in the prometheus env file}","--storage.tsdb.retention.size=${AELEV_INFRASTRUCTURE_PROMETHEUS_RETENTION_SIZE:?set in the prometheus env file}","--log.format=json"]
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=https://localhost:9090", "--http.config.file=/etc/aelev/client.yml"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - prometheus-data:/prometheus
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_RUNTIME_ROOT:?set in the prometheus env file}
        target: /etc/aelev
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_SECRET_ROOT:?set in the prometheus env file}
        target: /run/secrets/observability
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "${AELEV_INFRASTRUCTURE_PROMETHEUS_BIND:?set in the prometheus env file}:${AELEV_INFRASTRUCTURE_PROMETHEUS_PORT:?set in the prometheus env file}:9090"
    extra_hosts: ["delivery:host-gateway", "otel-collector:host-gateway", "blackbox-exporter:host-gateway", "loki:host-gateway", "tempo:host-gateway", "grafana:host-gateway"]

  prometheus-configuration-init:
    image: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_IMAGE:?set own tools image}
    build:
      context: .
      dockerfile: Dockerfile.status
      target: runtime
      args: {PYTHON_IMAGE: "${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_PYTHON_IMAGE:?set own Python image}"}
    profiles: [provision]
    entrypoint: [python, -m, aelev_observability_tools]
    command: [--owner, "${AELEV_INFRASTRUCTURE_PROMETHEUS_DATA_OWNER:?set immutable data owner}", --role, prometheus, --uid, "65534"]
    user: "0:0"
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes: [prometheus-data:/data]

  prometheus-status-publisher:
    <<: *status-runtime
    profiles: [ui]
    command: [run]
    stop_grace_period: 2m
    user: "101:101"
    group_add: ["${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_SECRET_GID:?set in the prometheus env file}"]
    restart: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_RESTART_POLICY:?set finite publisher policy in own env}
    mem_limit: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_MEMORY_LIMIT:?set in the prometheus env file}
    volumes:
      - prometheus-status-data:/var/lib/aelev-status
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_SECRET_ROOT:?set in the prometheus env file}
        target: /run/secrets/status
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "python", "-S", "/opt/aelev/publisher-health.py", "AELEV_INFRASTRUCTURE_PROMETHEUS_"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  prometheus-status-provision:
    <<: *status-runtime
    profiles: [provision]
    command: [provision]
    user: "${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_PROVISION_UID:?set in the prometheus env file}:${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_SECRET_GID:?set in the prometheus env file}"
    restart: "no"
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_SECRET_ROOT:?set in the prometheus env file}
        target: /run/secrets/status
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_ADMIN_ROOT:?set in the prometheus env file}
        target: /run/secrets/status-admin
        read_only: true
        bind: {create_host_path: false}

volumes:
  prometheus-data:
    name: ${AELEV_INFRASTRUCTURE_PROMETHEUS_DATA_VOLUME:?set own data volume}
  prometheus-status-data:
    name: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_STATE_VOLUME:?set in the prometheus env file}

networks:
  prometheus-ui:
    name: ${AELEV_INFRASTRUCTURE_PROMETHEUS_UI_NETWORK:?set in the prometheus env file}
