name: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_COMPOSE_PROJECT:?set in .env}
x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    NODE_IMAGE: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_NODE_IMAGE:?set in .env}
    NGINX_IMAGE: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_NGINX_IMAGE:?set in .env}
    PYTHON_IMAGE: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_PYTHON_IMAGE:?set in .env}
x-ui-status-environment: &ui-status-environment
  AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_URL: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_URL:?set in the platform-ui .env file}
  AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_IDENTITY_URL: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_IDENTITY_URL:?set in the platform-ui .env file}
  AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_REALM: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_REALM:?set in the platform-ui .env file}
  AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_CLIENT_ID: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_CLIENT_ID:?set in the platform-ui .env file}
  AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_AUDIENCE: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_AUDIENCE:?set in the platform-ui .env file}
  AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_MODULE_ID: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_MODULE_ID:?set in the platform-ui .env file}
  AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_INTERVAL_SECONDS: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_INTERVAL_SECONDS:?set in the platform-ui .env file}
  AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_TIMEOUT_SECONDS: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_TIMEOUT_SECONDS:?set in the platform-ui .env file}

services:
  platform-ui-status-publisher:
    image: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_STATUS_IMAGE:?set own publisher image in the platform-ui .env file}
    build: {<<: *build, target: publisher}
    profiles: [ui]
    labels:
      io.aelev.recovery.registration: unguarded-automatic-v1
    entrypoint: ["python", "/opt/platform-ui/status_publisher.py"]
    command: [run]
    stop_grace_period: 2m
    user: "101:101"
    group_add: ["${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_SECRET_GID:?set in the platform-ui .env file}"]
    environment: *ui-status-environment
    restart: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_RESTART_POLICY:?set finite publisher policy in own env}
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts: ["host.docker.internal:host-gateway", "keycloak:host-gateway"]
    mem_limit: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_MEMORY_LIMIT:?set in the platform-ui .env file}
    volumes:
      - platform-ui-status-data:/var/lib/aelev-status
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_SECRET_ROOT:?set in the platform-ui .env file}
        target: /run/secrets/status
        read_only: true
        bind: {create_host_path: false}
    networks: [platform-ui-backend, platform-ui-egress]
    healthcheck:
      test: ["CMD", "python", "-S", "/opt/platform-ui/publisher-health.py", "AELEV_INFRASTRUCTURE_PLATFORM_UI_"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  platform-ui-status-provision:
    image: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_API_IMAGE:?set in the platform-ui .env file}
    build: {<<: *build, target: api}
    profiles: [provision]
    entrypoint: ["python", "/opt/platform-ui/status_publisher.py"]
    command: [provision]
    user: "${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_PROVISION_UID:?set in the platform-ui .env file}:${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_SECRET_GID:?set in the platform-ui .env file}"
    environment: *ui-status-environment
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts: ["host.docker.internal:host-gateway", "keycloak:host-gateway"]
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_SECRET_ROOT:?set in the platform-ui .env file}
        target: /run/secrets/status
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_ADMIN_ROOT:?set in the platform-ui .env file}
        target: /run/secrets/status-admin
        read_only: true
        bind: {create_host_path: false}
    networks: [platform-ui-backend, platform-ui-egress]


  platform-ui:
    image: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_IMAGE:?set in .env}
    build: {<<: *build, target: ui}
    labels:
      io.aelev.recovery.registration: unguarded-automatic-v1
    depends_on:
      platform-ui-api: {condition: service_healthy}
    ports: ["${AELEV_INFRASTRUCTURE_PLATFORM_UI_BIND:?set in .env}:${AELEV_INFRASTRUCTURE_PLATFORM_UI_PORT:?set in .env}:8443"]
    group_add: ["${AELEV_INFRASTRUCTURE_PLATFORM_UI_SECRET_GID:?set in .env}"]
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_SECRET_ROOT:?set in .env}/nginx
        target: /run/secrets/nginx
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_RUNTIME_ROOT:?set in .env}/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_RUNTIME_ROOT:?set in .env}/config.json
        target: /usr/share/nginx/html/config.json
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_MEMORY_LIMIT:?set in .env}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /run/secrets/nginx/ca.crt, https://127.0.0.1:8443/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: "no"
    networks: [platform-ui-backend, platform-ui-egress]
  platform-ui-api:
    image: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_API_IMAGE:?set in .env}
    build: {<<: *build, target: api}
    labels:
      io.aelev.recovery.registration: unguarded-automatic-v1
    group_add: ["${AELEV_INFRASTRUCTURE_PLATFORM_UI_SECRET_GID:?set in .env}"]
    extra_hosts: ["keycloak:host-gateway"]
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_SECRET_ROOT:?set in .env}/api
        target: /run/secrets/api
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_RUNTIME_ROOT:?set in .env}/api.json
        target: /etc/platform-ui/api.json
        read_only: true
        bind: {create_host_path: false}
      - platform-ui-data:/var/lib/platform-ui
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_API_MEMORY_LIMIT:?set in .env}
    healthcheck:
      test: [CMD, python, /opt/platform-ui/health.py]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: "no"
    networks: [platform-ui-backend, platform-ui-egress]
  platform-ui-configuration-init:
    image: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_API_IMAGE:?set in .env}
    build: {<<: *build, target: api}
    profiles: [provision]
    command: [python, /opt/platform-ui/provision.py, /etc/platform-ui/provision.json]
    group_add: ["${AELEV_INFRASTRUCTURE_PLATFORM_UI_SECRET_GID:?set in .env}"]
    extra_hosts: ["keycloak:host-gateway"]
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_SECRET_ROOT:?set in .env}/provision
        target: /run/secrets/provision
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_RUNTIME_ROOT:?set in .env}/provision.json
        target: /etc/platform-ui/provision.json
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    networks: [platform-ui-egress]
volumes:
  platform-ui-status-data:
    name: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_UI_STATE_VOLUME:?set in the platform-ui .env file}
  platform-ui-data:
    name: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_DATA_VOLUME:?set in .env}
networks:
  platform-ui-backend:
    name: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_BACKEND_NETWORK:?set in .env}
    internal: true
    ipam:
      config:
        - subnet: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_BACKEND_SUBNET:?set in .env}
  platform-ui-egress:
    name: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_EGRESS_NETWORK:?set in .env}
    ipam:
      config:
        - subnet: ${AELEV_INFRASTRUCTURE_PLATFORM_UI_EGRESS_SUBNET:?set in .env}
