server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /run/secrets/nginx/server.crt;
  ssl_certificate_key /run/secrets/nginx/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_client_certificate /run/secrets/nginx/publisher-ca.crt;
  ssl_verify_client optional;
  client_max_body_size @@MAX_BODY_BYTES@@;
  root /usr/share/nginx/html;
  index index.html;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control no-store always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' @@KEYCLOAK_ORIGIN@@; frame-src https: http://127.0.0.1:* http://localhost:* http://[::1]:*; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' @@KEYCLOAK_ORIGIN@@" always;
  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
  location = /readyz {
    access_log off;
    proxy_pass https://platform-ui-api:8444/api/readyz;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/nginx/ca.crt;
    proxy_ssl_certificate /run/secrets/nginx/client.crt;
    proxy_ssl_certificate_key /run/secrets/nginx/client.key;
    proxy_ssl_server_name on;
    proxy_ssl_name platform-ui-api;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  location = /config.json { try_files $uri =404; }
  location ~ ^/presentation/v[123456]\.css$ {
    add_header Access-Control-Allow-Origin '*';
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }
  location /assets/ { try_files $uri =404; }
  location /api/ {
    proxy_pass https://platform-ui-api:8444;
    proxy_set_header X-Verified-Publisher $ssl_client_verify;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/secrets/nginx/ca.crt;
    proxy_ssl_certificate /run/secrets/nginx/client.crt;
    proxy_ssl_certificate_key /run/secrets/nginx/client.key;
    proxy_ssl_server_name on;
    proxy_ssl_name platform-ui-api;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_hide_header Access-Control-Allow-Origin;
  }
  location / { try_files $uri /index.html; }
}
