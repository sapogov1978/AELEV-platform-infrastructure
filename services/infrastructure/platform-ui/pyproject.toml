[tool.poetry]
name = "aelev-platform-ui-api"
version = "1.1.0"
description = "Authenticated technical injection for the generic UI shell"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
aelev-platform-ui-client = {path = "vendor/aelev_platform_ui_client-1.1.1-py3-none-any.whl"}
fastapi = "0.141.1"
starlette = "1.3.1"
httpx = "0.28.1"
pydantic = "2.13.5"
PyJWT = {version = "2.15.0", extras = ["crypto"]}
cryptography = "50.0.1"
uvicorn = "0.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
black = "26.10.1"
ruff = "0.13.2"
mypy = "1.18.2"

[tool.black]
target-version = ["py313"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
