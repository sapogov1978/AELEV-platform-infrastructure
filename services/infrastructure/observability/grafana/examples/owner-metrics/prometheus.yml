global:
  scrape_interval: 2s
  scrape_timeout: 1s
scrape_configs:
  - job_name: owner-demo
    scheme: https
    static_configs:
      - targets: [exporter:9443]
    tls_config:
      ca_file: /run/secrets/telemetry/server-ca.crt
      cert_file: /run/secrets/telemetry/local-write.crt
      key_file: /run/secrets/telemetry/local-write.key
remote_write:
  - url: https://localhost:4318/api/v1/write
    protobuf_message: prometheus.WriteRequest
    remote_timeout: 5s
    tls_config:
      ca_file: /run/secrets/telemetry/server-ca.crt
      cert_file: /run/secrets/telemetry/local-write.crt
      key_file: /run/secrets/telemetry/local-write.key
    queue_config:
      min_shards: 1
      max_shards: 1
      capacity: 1000
      max_samples_per_send: 100
      batch_send_deadline: 2s
