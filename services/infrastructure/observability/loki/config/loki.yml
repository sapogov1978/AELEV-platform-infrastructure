# One technical tenant; mandatory mTLS supplies authentication.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  tls_min_version: VersionTLS12
  http_tls_config:
    cert_file: /run/secrets/observability/server.crt
    key_file: /run/secrets/observability/server.key
    client_ca_file: /run/secrets/observability/ca.crt
    client_auth_type: RequireAndVerifyClientCert

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: ${AELEV_INFRASTRUCTURE_LOKI_RETENTION}
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
