[tool.poetry]
name = "aelev-observability"
version = "0.1.0"
description = "Consumer-agnostic single-node technical observability"
authors = ["AELEV"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
black = "26.10.1"
ruff = "0.13.2"
mypy = "1.18.2"

[tool.black]
target-version = ["py313"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
