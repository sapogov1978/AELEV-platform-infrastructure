# Configuration-only model for native Kubernetes deployment. PostgreSQL start
# rejects this mechanism outside the exact native Pod runtime; Docker containers
# must not receive receipts for different Kubernetes processes.
x-fencing: &fencing
  environment:
    AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_TIMEOUT_SECONDS: ${AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_TIMEOUT_SECONDS:?set AELEV_INFRASTRUCTURE_POSTGRESQL_FENCING_TIMEOUT_SECONDS}
    AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_FENCING_URL: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_FENCING_URL:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_1_FENCING_URL}
    AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_FENCING_URL: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_FENCING_URL:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_2_FENCING_URL}
    AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_FENCING_URL: ${AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_FENCING_URL:?set AELEV_INFRASTRUCTURE_POSTGRESQL_NODE_3_FENCING_URL}
services:
  postgresql-status-publisher: *fencing
  postgresql-1: *fencing
  postgresql-2: *fencing
  postgresql-3: *fencing
