  minio-site-a-3-data:
    name: ${AELEV_INFRASTRUCTURE_MINIO_SITE_A_NODE_3_VOLUME:?set AELEV_INFRASTRUCTURE_MINIO_SITE_A_NODE_3_VOLUME in the MinIO .env file}
  minio-site-a-4-data:
    name: ${AELEV_INFRASTRUCTURE_MINIO_SITE_A_NODE_4_VOLUME:?set AELEV_INFRASTRUCTURE_MINIO_SITE_A_NODE_4_VOLUME in the MinIO .env file}
  minio-site-b-1-data:
