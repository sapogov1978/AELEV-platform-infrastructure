events {}

http {
  upstream minio_site_a {
    least_conn;
    server minio-site-a-1:9000 max_fails=1 fail_timeout=2s;
    server minio-site-a-2:9000 max_fails=1 fail_timeout=2s;
    server minio-site-a-3:9000 max_fails=1 fail_timeout=2s;
    server minio-site-a-4:9000 max_fails=1 fail_timeout=2s;
  }

  server {
    listen 9000 ssl;
    server_name minio-site-a-lb;

    ssl_certificate /certs/public.crt;
    ssl_certificate_key /certs/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 4;
    proxy_ssl_server_name on;
    proxy_ssl_name minio-site-a;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /certs/CAs/aelev-minio-sites.crt;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";

    location / {
      proxy_pass https://minio_site_a;
    }
  }
}
