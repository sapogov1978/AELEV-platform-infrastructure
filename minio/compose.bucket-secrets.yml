# Explicit file-only credentials for this one bucket-provisioner operation.
services:
  bucket-provisioner:
    environment:
      AELEV_INFRASTRUCTURE_MINIO_PROVISION_ACCESS_KEY_FILE: /run/secrets/minio-provision-access-key
      AELEV_INFRASTRUCTURE_MINIO_PROVISION_SECRET_KEY_FILE: /run/secrets/minio-provision-secret-key
    volumes:
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_MINIO_PROVISION_ACCESS_KEY_FILE:?set this operation's access-key file}
        target: /run/secrets/minio-provision-access-key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AELEV_INFRASTRUCTURE_MINIO_PROVISION_SECRET_KEY_FILE:?set this operation's secret-key file}
        target: /run/secrets/minio-provision-secret-key
        read_only: true
        bind: {create_host_path: false}
