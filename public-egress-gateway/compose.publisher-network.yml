# Select only for this independently placed owner status publisher.
services:
  public-egress-gateway-status-publisher:
    environment:
      AELEV_INFRASTRUCTURE_PUBLIC_EGRESS_GATEWAY_UI_PROBE_PROFILE: network
      AELEV_INFRASTRUCTURE_PUBLIC_EGRESS_GATEWAY_UI_GATEWAY_PROBE_URL: ${AELEV_INFRASTRUCTURE_PUBLIC_EGRESS_GATEWAY_UI_GATEWAY_PROBE_URL:?set this publisher's explicit HTTPS readyz URL}
      AELEV_INFRASTRUCTURE_PUBLIC_EGRESS_GATEWAY_UI_GATEWAY_PROBE_SERVER_NAME: ${AELEV_INFRASTRUCTURE_PUBLIC_EGRESS_GATEWAY_UI_GATEWAY_PROBE_SERVER_NAME:?set the gateway server certificate name}
      AELEV_INFRASTRUCTURE_PUBLIC_EGRESS_GATEWAY_UI_GATEWAY_PROBE_CA_FILE: ${AELEV_INFRASTRUCTURE_PUBLIC_EGRESS_GATEWAY_UI_GATEWAY_PROBE_CA_FILE:?set this publisher's mounted public gateway CA file}
